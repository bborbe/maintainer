apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: maintainer-watcher-github-build
  namespace: '{{ "NAMESPACE" | env }}'
data:
  GH_TOKEN: '{{ "WATCHER_GITHUB_BUILD_GH_TOKEN_KEY" | env | teamvaultPassword | base64 }}'
  PEM_KEY: '{{ "WATCHER_GITHUB_BUILD_PEM_KEY" | env | teamvaultFileBase64 }}'
