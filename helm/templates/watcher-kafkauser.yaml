{{- range $watcher := .Values.watchers }}
{{- if $watcher.enabled }}
{{- if (($watcher.kafkaUser | default dict).enabled) }}
{{- $ku := $watcher.kafkaUser }}
---
# Strimzi KafkaUser for this watcher's mTLS Kafka auth (one per enabled watcher).
# Lives in the Strimzi operator's namespace, labelled with the target Kafka
# cluster. Off by default. Strimzi issues a same-named Secret with user.crt/
# user.key; an external syncer places it (+ the cluster CA) into the app
# namespace where the watcher pod mounts it (see watchers[].kafkaUser).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: {{ $ku.userName | default (printf "%s-%s" (include "maintainer.namespace" $) $watcher.name) }}
  namespace: {{ $ku.strimziNamespace | default "strimzi" }}
  labels:
    strimzi.io/cluster: {{ $ku.cluster | default "my-cluster" }}
    {{- include "maintainer.labels" $ | nindent 4 }}
spec:
  authentication:
    type: tls
{{- end }}
{{- end }}
{{- end }}
