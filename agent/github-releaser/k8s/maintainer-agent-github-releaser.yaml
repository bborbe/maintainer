# Agent pushes per-agent Prometheus metrics (agent_job_run_total{status}, agent_job_last_run_timestamp_seconds{status}, agent_job_duration_seconds) to PushGateway at Job end.
# Envs (defaulted in main.go struct tags, no manifest change needed for cluster deploy):
#   PUSHGATEWAY_URL  default "http://pushgateway:9090" — cluster-internal address resolves automatically.
#   TASK_TYPE        default "unknown" — executor-side population is a follow-up; metrics carry task_type="unknown" until then.
apiVersion: agent.benjamin-borbe.de/v1
kind: Config
metadata:
  name: maintainer-agent-github-releaser
  namespace: '{{ "NAMESPACE" | env }}'
spec:
  assignee: github-releaser-agent
  taskTypes:
    - github-release
    - healthcheck
  priorityClassName: maintainer-agent-github-releaser
  image: '{{"DOCKER_REGISTRY" | env}}/maintainer-agent-github-releaser'
  heartbeat: 5m
  secretName: maintainer-agent-github-releaser
  env:
    # Tell Claude Code where the image-resident config + plugins live (the /coding
    # plugin is baked into the image at this path; no volume is mounted). The
    # planning phase invokes Claude with an embedded bump-classification prompt
    # (pkg/prompts), so it does not depend on a /coding slash command, but the
    # config dir is still where the claude CLI resolves its settings.
    CLAUDE_CONFIG_DIR: /home/claude/.claude
    # Defense-in-depth allowlist mirroring watcher's REPO_ALLOWLIST. Agent refuses
    # to clone tasks whose host/owner/repo is not on the list. Empty = allow-all.
    REPO_ALLOWLIST: '{{ "REPO_ALLOWLIST" | env }}'
    # Anthropic-compatible alt-provider routing (MiniMax). The Go binary reads
    # ANTHROPIC_MODEL into the AnthropicModel field and forwards it to the claude
    # subprocess as both the --model flag and the ANTHROPIC_MODEL env var.
    # ANTHROPIC_AUTH_TOKEN is sourced from the agent secret (teamvault MOPmQL).
    ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
    ANTHROPIC_MODEL: MiniMax-M2.7-highspeed
    # GitHub App auth — pod mints an installation access token at startup. The
    # PEM content is injected as env var $PEM_KEY via the Secret's envFrom mount
    # (controller wires Secret keys as env vars, not files — see
    # agent/task/executor/pkg/agent_configuration.go). The releaser App is a
    # DEDICATED least-privilege identity (Contents: read & write) separate from
    # the read-only pr-reviewer App; it must be added as a branch-protection
    # bypass actor on each opted-in target repo for direct-push releases.
    APP_ID: '{{ "AGENT_GITHUB_RELEASER_APP_ID" | env }}'
    INSTALLATION_ID: '{{ "AGENT_GITHUB_RELEASER_INSTALLATION_ID" | env }}'
  trigger:
    statuses:
      - in_progress
    phases:
      - planning
      - execution
      - ai_review
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 5Gi
    limits:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 5Gi
