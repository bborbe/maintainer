# maintainer-bot per-repo config — controls how the bot (ben-s-pull-request-reviewer[bot])
# behaves on this repo's PRs and releases.
#
# Schema (all fields default false when the file or field is absent):
#   release:
#     autoRelease: true   # github-release watcher gate
#   prReviewer:
#     autoApprove: true   # pr-reviewer agent gate
#
# prReviewer.autoApprove:
#   - verdict "approve"         → posts as APPROVE (counts toward branch-protection reviewer gates)
#   - verdict "request-changes" → posts as REQUEST_CHANGES (always)
#   when false (or absent): "approve" is demoted to a COMMENT.
#
# This replaces the legacy .pr-reviewer.yaml (kept temporarily until the new
# pr-reviewer image is deployed to prod; removed in a follow-up cleanup).
prReviewer:
  autoApprove: true
release:
  autoRelease: true
goUpdate:
  autoUpdate: true
